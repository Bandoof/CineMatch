repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-imports
        name: Ruff imports (incremental scope)
        entry: python -m ruff check --select I
        language: system
        files: ^(src/(profile_actions|hybrid|ranking|explanations|modern_catalog|providers|catalog_view|discovery_search|discovery_collections|library_actions|research_[a-z_]+)|app/(catalog_explorer|product_ui)|scripts/(benchmark_discovery|verify_product_browser|sync_catalog|prepare_research|research_v12|download_research|verify_v12_evidence)|tests/(test_catalog_performance_equivalence|test_product_ui|test_library_actions|test_discovery_search|test_modern_catalog|test_catalog_explorer|test_research_[a-z_]+|test_faithful_explanations|test_v12_evidence))\.py$
      - id: ruff-format
        name: Ruff format (incremental scope)
        entry: python -m ruff format --check
        language: system
        files: ^(src/(profile_actions|hybrid|ranking|explanations|modern_catalog|providers|catalog_view|discovery_search|discovery_collections)|app/(catalog_explorer|product_ui)|tests/(test_catalog_performance_equivalence|test_product_ui|test_library_actions|test_discovery_search|test_modern_catalog|test_catalog_explorer|test_profile_actions|test_state_reliability|test_performance_equivalence|test_search_ui|test_runtime_reliability)|scripts/(benchmark_discovery|verify_product_browser|sync_catalog|benchmark_performance|prepare_research|research_v12|download_research|verify_v12_evidence)|src/research_[a-z_]+|tests/(test_research_[a-z_]+|test_faithful_explanations|test_v12_evidence))\.py$
      - id: mypy
        name: Mypy (incremental scope)
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
