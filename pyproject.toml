[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Expand typing gradually at pure numerical/state boundaries, without blanket ignores.
[tool.mypy]
python_version = "3.10"
files = ["src/profile_actions.py", "src/hybrid.py", "src/ranking.py"]
strict = true
