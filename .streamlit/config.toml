[theme]
base = "dark"
primaryColor = "#e6b35a"
backgroundColor = "#0b1018"
secondaryBackgroundColor = "#151f2c"
textColor = "#edf1f7"
font = "sans serif"

[server]
address = "127.0.0.1"
headless = true
runOnSave = true
maxUploadSize = 1
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[global]
# Restored preferences intentionally precede widget defaults; values are validated.
disableWidgetStateDuplicationWarning = true
