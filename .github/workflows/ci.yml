name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff check --select I src/profile_actions.py src/hybrid.py src/ranking.py src/research_protocol.py src/research_models.py src/research_embeddings.py src/research_onboarding.py scripts/prepare_research.py scripts/research_v12.py scripts/download_research.py tests/test_research_protocol.py tests/test_research_models.py tests/test_research_runner.py tests/test_research_encoder_integration.py
      - run: python -m ruff format --check src/profile_actions.py src/hybrid.py src/ranking.py tests/test_profile_actions.py tests/test_state_reliability.py scripts/benchmark_performance.py tests/test_performance_equivalence.py tests/test_search_ui.py tests/test_runtime_reliability.py src/research_protocol.py src/research_models.py src/research_embeddings.py src/research_onboarding.py scripts/prepare_research.py scripts/research_v12.py scripts/download_research.py tests/test_research_protocol.py tests/test_research_models.py tests/test_research_runner.py tests/test_research_encoder_integration.py
      - run: python -m mypy
      - run: python -m pytest -q --cov=app --cov=src --cov=scripts --cov-report=term-missing
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/cinematch-matplotlib
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-research.txt
