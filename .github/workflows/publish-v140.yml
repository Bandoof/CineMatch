name: Publish verified CineMatch v1.4.0
on:
  push:
    branches: ['release/v1.4.0-publication']
    paths: ['.github/workflows/publish-v140.yml']
permissions:
  contents: write
  checks: read
  actions: read
  statuses: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Bandoof/CineMatch
      RELEASE_SHA: f755bffcf5d4ebf520aa58679383051ee204e86b
    steps:
      - name: Wait for existing final-main checks and publish the exact verified commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/branches/main --jq .commit.sha)" = "$RELEASE_SHA"
          required='["Test (ubuntu-latest, Python 3.10)","Test (ubuntu-latest, Python 3.11)","Test (windows-latest, Python 3.11)","security","Python analysis","CodeQL"]'
          ready=false
          for attempt in $(seq 1 150); do
            gh api "repos/$GH_REPO/commits/$RELEASE_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
            jq '{check_runs: (.check_runs | group_by(.name) | map(max_by(.id)))}' "$RUNNER_TEMP/checks.json" > "$RUNNER_TEMP/latest-checks.json"
            mv "$RUNNER_TEMP/latest-checks.json" "$RUNNER_TEMP/checks.json"
            if jq -e --argjson required "$required" '[.check_runs[] | select(.name as $name | $required | index($name)) | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required"))] | length > 0' "$RUNNER_TEMP/checks.json" > /dev/null; then
              echo "Final-main checks did not pass; release blocked."; exit 1
            fi
            if jq -e --argjson required "$required" '[.check_runs[] | select(.status == "completed" and .conclusion == "success") | .name] as $passed | ($required - $passed | length) == 0' "$RUNNER_TEMP/checks.json" > /dev/null; then
              ready=true; break
            fi
            sleep 5
          done
          test "$ready" = true
          test "$(gh api repos/$GH_REPO/branches/main --jq .commit.sha)" = "$RELEASE_SHA"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## CineMatch v1.4.0

          - v1.1: reliable local profiles, library actions and transparent recommendation controls.
          - v1.2: reproducible offline ML research workflows and preserved evaluation evidence.
          - v1.3: bilingual movie/series discovery, provider-aware metadata and product QA.
          - v1.4: Ukrainian discovery, a session-isolated synthetic portfolio demo, explicit recommendation modes, browser QA and a bilingual engineering case study.

          The dedicated public-demo entry point is app/portfolio_app.py. It uses temporary per-visitor preferences, avoids SQLite/profile stores and provider credentials, and supports reset. The optional bounded public MovieLens pack remains separate from Git; without it, the interface explicitly uses metadata/genre heuristics.

          ML research features and algorithm demonstrations are not newly validated accuracy improvements. Modern-title heuristics and missing-model fallbacks are disclosed. No new training experiment, final holdout or historical benchmark was run for this release.

          Validation: final-main Linux/Windows tests, Ruff/Mypy, dependency audit and CodeQL; existing successful browser QA covers the unchanged application code, including startup/health, search, recommendations, reset, refresh and two-visitor isolation. No private databases, user profiles or research caches are attached.

          Public Streamlit Community Cloud deployment remains pending operator access and live-instance verification. No live demo URL is claimed.
          NOTES
          if gh api repos/$GH_REPO/git/ref/tags/v1.4.0 > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
            test "$(jq -r .object.sha "$RUNNER_TEMP/tag.json")" = "$RELEASE_SHA"
          else
            gh api --method POST repos/$GH_REPO/git/refs -f ref=refs/tags/v1.4.0 -f sha="$RELEASE_SHA"
          fi
          gh release create v1.4.0 --verify-tag --target "$RELEASE_SHA" --title "CineMatch v1.4.0" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
